<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusGuard - Login & Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #070d1e 0%, #0b1329 50%, #162447 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        .auth-header {
            background-color: #0b1329;
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
            border-bottom: 2px solid #0284c7;
        }
        .auth-body {
            padding: 30px;
        }
        .nav-pills .nav-link {
            color: #475569;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 16px;
        }
        .nav-pills .nav-link.active {
            background-color: #0284c7;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="brand-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 22px;">
                <i class="bi bi-shield-check"></i>
            </div>
            <h3 class="mb-0 fw-bold">NexusGuard</h3>
            <p class="text-info small mb-0">AI Logistics Risk Prediction & Fraud Detection</p>
        </div>

        <div class="auth-body">
            <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Sign In</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Create Account</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Login Pane -->
                <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Work Email</label>
                            <input type="email" id="loginEmail" class="form-control" required placeholder="admin@nexusguard.io" value="admin@nexusguard.io">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••" value="admin123">
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-nexus-primary py-2 fw-bold" id="btnLogin">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Access Operations Console
                            </button>
                        </div>
                        <div class="alert alert-light border small text-muted mb-0">
                            <strong>Demo Credentials Pre-filled:</strong><br/>
                            Email: <code>admin@nexusguard.io</code> | Password: <code>admin123</code>
                        </div>
                    </form>
                </div>

                <!-- Register Pane -->
                <div class="tab-pane fade" id="register-pane" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" id="regName" class="form-control" required placeholder="John Logistics">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Corporate Email</label>
                            <input type="email" id="regEmail" class="form-control" required placeholder="john@enterprise.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Operational Role</label>
                            <select id="regRole" class="form-select">
                                <option value="Logistics Operations Lead">Logistics Operations Lead</option>
                                <option value="Supply Chain Security Officer">Supply Chain Security Officer</option>
                                <option value="Customs Compliance Specialist">Customs Compliance Specialist</option>
                                <option value="Freight Dispatch Supervisor">Freight Dispatch Supervisor</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Create Secure Password</label>
                            <input type="password" id="regPassword" class="form-control" required minlength="6" placeholder="At least 6 characters">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-nexus-primary py-2 fw-bold" id="btnRegister">
                                <i class="bi bi-person-check me-1"></i> Register Account
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnLogin");
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Authenticating...`;

            try {
                const resp = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("loginEmail").value,
                        password: document.getElementById("loginPassword").value
                    })
                });
                const data = await resp.json();
                if (resp.ok) {
                    NexusApp.setAuth(data.access_token, {
                        name: data.user_name,
                        email: data.user_email,
                        role: data.user_role
                    });
                    window.location.href = "/dashboard";
                } else {
                    alert(data.detail || "Authentication failed. Please verify credentials.");
                }
            } catch (err) {
                alert("Connection error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Access Operations Console`;
            }
        });

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnRegister");
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Registering...`;

            try {
                const resp = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: document.getElementById("regName").value,
                        email: document.getElementById("regEmail").value,
                        role: document.getElementById("regRole").value,
                        password: document.getElementById("regPassword").value
                    })
                });
                const data = await resp.json();
                if (resp.ok) {
                    NexusApp.setAuth(data.access_token, {
                        name: data.user_name,
                        email: data.user_email,
                        role: data.user_role
                    });
                    window.location.href = "/dashboard";
                } else {
                    alert(data.detail || "Registration failed.");
                }
            } catch (err) {
                alert("Connection error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-person-check me-1"></i> Register Account`;
            }
        });
    </script>
</body>
</html>
